name: Данные клана (прямой эфир)

# Каждые 30 минут запускается задача, которая ~27 минут подряд обновляет
# данные каждые 2 минуты. Так обновления идут почти непрерывно, даже если
# GitHub запускает расписание с опозданием.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Обновлять данные каждые 2 минуты
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          TZ: Europe/Zurich
        run: |
          git config user.name "wizars-bot"
          git config user.email "wizars-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 27*60 ))
          while :; do
            python scripts/update.py || echo "обновление не удалось, пробую дальше"
            git add data state
            if ! git diff --cached --quiet; then
              git commit -q -m "Данные $(date '+%d.%m %H:%M')"
              git pull -q --rebase -X ours || true
              git push -q || echo "push не прошёл"
            fi
            [ $(( $(date +%s) + 120 )) -ge $end ] && break
            sleep 120
          done
