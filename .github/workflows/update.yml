name: Обновление данных и сайта

on:
  schedule:
    - cron: "17 * * * *"   # каждый час
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать данные клана
        if: github.event_name != 'push'
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          TZ: Europe/Zurich
        run: python scripts/update.py
      - name: Сохранить данные в репозиторий
        if: github.event_name != 'push'
        run: |
          git config user.name "wizars-bot"
          git config user.email "wizars-bot@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "Данные $(TZ=Europe/Zurich date '+%d.%m %H:%M')"
          git push || (git pull --rebase && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
