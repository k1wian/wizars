name: Обновление данных и сайта

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут (чаще GitHub не разрешает)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name != 'schedule' && 'github-pages' || 'data' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать данные клана
        if: github.event_name != 'push'
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          TZ: Europe/Zurich
        run: python scripts/update.py
      - name: Сохранить данные в репозиторий
        if: github.event_name != 'push'
        run: |
          git config user.name "wizars-bot"
          git config user.email "wizars-bot@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "Данные $(TZ=Europe/Zurich date '+%d.%m %H:%M')"
          git push || (git pull --rebase && git push)
      # сайт пересобираем только при изменении кода; данные страница берёт прямо из репозитория
      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule'
        with:
          path: .
      - id: deploy
        if: github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
